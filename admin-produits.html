<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#22c55e"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Clo-Clo"/>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Produits – Clo-Clo Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="admin.css"/>
  <script src="config.js"></script>
  <style>
    .products-grid-admin { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .pcard { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 14px rgba(0,0,0,0.07); }
    .pcard img { width: 100%; height: 140px; object-fit: cover; }
    .pcard-body { padding: 16px; }
    .pcard-name { font-weight: 800; color: var(--text-dark); font-size: 1rem; margin-bottom: 4px; }
    .pcard-cat { font-size: 0.78rem; color: var(--text-gray); font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
    .pcard-price { font-weight: 900; color: var(--green); font-size: 1.05rem; margin-bottom: 12px; }
    .pcard-actions { display: flex; gap: 8px; }
    .pcard-actions button { flex: 1; border: none; border-radius: 10px; padding: 9px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.85rem; cursor: pointer; }
    .btn-edit { background: #eff6ff; color: #3b82f6; }
    .btn-delete { background: #fef2f2; color: #ef4444; }

    /* Modale formulaire produit */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 999; display: none; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: white; border-radius: 18px; padding: 28px; width: 90%; max-width: 440px; max-height: 90vh; overflow-y: auto; }
    .modal-title { font-weight: 900; font-size: 1.15rem; color: var(--text-dark); margin-bottom: 18px; }
    .modal-box .form-group { margin-bottom: 14px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-actions button { flex: 1; border: none; border-radius: 12px; padding: 12px; font-family: 'Nunito', sans-serif; font-weight: 800; cursor: pointer; }
    .btn-cancel { background: #f3f4f6; color: var(--text-dark); }
    .btn-submit { background: var(--green); color: white; }
  </style>
</head>
<body>

  <!-- ═══ SIDEBAR ═══ -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-logo">🍹</div>
      <div>
        <div class="sidebar-brand-name">Clo-Clo Admin</div>
        <div class="sidebar-brand-sub">Espace Directeur</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="admin-dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Tableau de Bord
      </a>
      <a href="admin-produits.html" class="nav-item active">
        <svg viewBox="0 0 24 24"><path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12.41V2h10.41l8.18 8.18a2 2 0 0 1 0 2.83z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
        Produits
      </a>
      <a href="admin-livraisons.html" class="nav-item">
        <svg viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
        Livraisons en Cours
      </a>
      <a href="admin-historique.html" class="nav-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Historique
      </a>
      <a href="admin-clients.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Clients
      </a>
      <a href="admin-livreurs.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Livreurs
      </a>
    </nav>
    <div class="sidebar-logout">
      <button class="btn-logout js-admin-logout">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Déconnexion
      </button>
    </div>
  </aside>

  <!-- ═══ CONTENU ═══ -->
  <main class="main-content">
    <div class="page-header anim" style="display:flex;justify-content:space-between;align-items:center;">
      <div>
        <h1 class="page-title">Gestion des Produits</h1>
        <p class="page-sub">Ajoutez, modifiez ou retirez des produits du menu</p>
      </div>
      <button class="btn-green" id="btn-new-product" style="padding:12px 22px;font-weight:800;border:none;border-radius:12px;cursor:pointer;">
        + Ajouter un produit
      </button>
    </div>

    <div class="products-grid-admin" id="products-grid-admin">
      <p style="grid-column:1/-1;text-align:center;color:#9ca3af;font-weight:700;">Chargement…</p>
    </div>
  </main>

  <!-- ═══ MODALE FORMULAIRE ═══ -->
  <div class="modal-overlay" id="product-modal">
    <div class="modal-box">
      <div class="modal-title" id="modal-title">Ajouter un produit</div>
      <input type="hidden" id="pf-id"/>
      <div class="form-group">
        <label class="form-label">Nom</label>
        <input class="form-input" type="text" id="pf-name" placeholder="Ex : Jus d'Ananas"/>
      </div>
      <div class="form-group">
        <label class="form-label">Catégorie</label>
        <select class="form-input" id="pf-category">
          <option value="jus">Jus</option>
          <option value="smoothies">Smoothies</option>
          <option value="glaces">Glaces</option>
          <option value="salades">Salades</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Prix (FCFA)</label>
        <input class="form-input" type="number" min="0" id="pf-price" placeholder="1500"/>
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <input class="form-input" type="text" id="pf-desc" placeholder="Courte description"/>
      </div>
      <div class="form-group">
        <label class="form-label">URL de l'image</label>
        <input class="form-input" type="text" id="pf-img" placeholder="https://..."/>
      </div>
      <div class="form-group" style="display:flex;align-items:center;gap:8px;">
        <input type="checkbox" id="pf-popular" style="width:18px;height:18px;"/>
        <label for="pf-popular" style="font-weight:700;color:var(--text-dark);">Produit populaire (mis en avant sur l'accueil)</label>
      </div>
      <p id="pf-error" style="color:#ef4444;font-weight:700;"></p>
      <div class="modal-actions">
        <button class="btn-cancel" id="btn-cancel-product">Annuler</button>
        <button class="btn-submit" id="btn-save-product">Enregistrer</button>
      </div>
    </div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
