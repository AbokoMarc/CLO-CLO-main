<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="icon" href="favicon.ico" sizes="any"/>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clo-Clo — Hors ligne</title>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#0F5B2C"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #F7FAF6;
      color: #12301C;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .wrap { max-width: 340px; }
    .icon { font-size: 3.2rem; margin-bottom: 18px; }
    h1 { font-size: 1.3rem; margin-bottom: 10px; }
    p { color: #5F6F63; font-size: 0.92rem; line-height: 1.5; margin-bottom: 24px; }
    button {
      background: #0F5B2C; color: white; border: none; border-radius: 12px;
      padding: 13px 28px; font-size: 0.95rem; font-weight: 800; cursor: pointer;
      font-family: inherit;
    }
    button:active { transform: scale(0.97); }
  </style>
  <link rel="stylesheet" href="theme.css"/>
</head>
<body>
  <div class="wrap">
    <div class="icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.15em" aria-hidden="true"><path d="M12 20v-6"/><path d="M8.5 17a5 5 0 0 1 7 0"/><path d="M5.5 14a9 9 0 0 1 13 0"/><circle cx="12" cy="20.5" r="1"/><path d="m3 3 18 18"/></svg></div>
    <h1>Pas de connexion internet</h1>
    <p>Cette page n'est pas encore disponible hors-ligne. Reconnectez-vous puis réessayez — vos pages déjà visitées, elles, restent accessibles.</p>
    <button onclick="window.location.reload()">Réessayer</button>
  </div>
  <script>
    /* Même préférence de langue que le reste du site (cloclo_lang). */
    if (localStorage.getItem("cloclo_lang") === "en") {
      document.documentElement.lang = "en";
      document.title = "Clo-Clo — Offline";
      document.querySelector("h1").textContent = "No internet connection";
      document.querySelector("p").textContent = "This page is not available offline yet. Reconnect and try again — pages you have already visited remain accessible.";
      document.querySelector("button").textContent = "Retry";
    }
  </script>
</body>
</html>
