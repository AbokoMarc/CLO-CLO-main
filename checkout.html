<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Confirmer la commande – Clo-Clo</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="profil.css"/>
  <script src="config.js"></script>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-brand">
      <div class="nav-logo">🍹</div>
      <div>
        <div class="nav-brand-name">Clo-Clo</div>
        <div class="nav-brand-sub">Bar à Fruits &amp; Délices</div>
      </div>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Accueil</a></li>
      <li><a href="menu.html">Menu</a></li>
      <li><a href="suivie.html">Suivi</a></li>
    </ul>
    <div class="nav-actions">
      <button class="btn-points"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><span id="points-label">0 pts</span></button>
      <button class="cart-btn" aria-label="Panier"><svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span class="cart-badge" id="cart-badge">0</span></button>
      <button class="btn-profile"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profil</button>
    </div>
  </nav>

  <section style="max-width:640px;margin:48px auto;padding:0 20px 80px;">
    <h1 style="font-size:1.7rem;font-weight:900;color:#1a1a2e;margin-bottom:6px;">Confirmer la commande</h1>
    <p style="color:#6b7280;font-weight:600;margin-bottom:28px;">Zone de livraison : Nkolfoulou, Yaoundé</p>

    <div id="checkout-summary" style="background:#f9fafb;border-radius:16px;padding:20px;margin-bottom:24px;"></div>

    <div class="form-group" style="margin-bottom:16px;">
      <label class="form-label">Quartier</label>
      <select class="form-input" id="input-quartier"></select>
    </div>

    <div class="form-group" style="margin-bottom:24px;">
      <label class="form-label">Adresse précise (repère, rue…)</label>
      <input class="form-input" type="text" id="input-adresse" placeholder="Ex : Nkolfoulou, non loin du carrefour marché"/>
    </div>

    <button id="btn-confirm" style="width:100%;background:#22c55e;color:white;border:none;border-radius:14px;padding:16px;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;">
      Confirmer et payer à la livraison
    </button>
    <p id="checkout-error" style="color:#ef4444;font-weight:700;margin-top:12px;text-align:center;"></p>
  </section>

  <script type="module" src="app-data.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="checkout.js"></script>
</body>
</html>
