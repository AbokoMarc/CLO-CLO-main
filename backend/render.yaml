# Déploiement du backend sur Render.com (render.com/docs/blueprint-spec)
# Utilisation : sur render.com → New → Blueprint → pointer sur ce dépôt.
services:
  - type: web
    name: cloclo-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: "npm install"
    startCommand: "node server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
    # Plus de disque Render : les données vivent sur Turso (persistant, gratuit),
    # donc aucun risque de perte au redéploiement/redémarrage du service gratuit.
