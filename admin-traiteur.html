  <style>
    .products-grid-admin { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .pcard { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 14px rgba(0,0,0,0.07); }
    .pcard img { width: 100%; height: 140px; object-fit: cover; }
    .pcard-body { padding: 16px; }
    .pcard-name { font-weight: 800; color: var(--text-dark); font-size: 1rem; margin-bottom: 4px; }
    .pcard-cat { font-size: 0.78rem; color: var(--text-gray); font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
    .pcard-price { font-weight: 900; color: var(--green); font-size: 1.05rem; margin-bottom: 12px; }
    .pcard-actions { display: flex; gap: 8px; }
    .pcard-actions button { flex: 1; border: none; border-radius: 10px; padding: 9px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.85rem; cursor: pointer; }
    .btn-edit { background: #eff6ff; color: #3b82f6; }
    .btn-delete { background: #fef2f2; color: #ef4444; }

    /* Modale formulaire produit */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 999; display: none; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: white; border-radius: 18px; padding: 28px; width: 90%; max-width: 440px; max-height: 90vh; overflow-y: auto; }
    .modal-title { font-weight: 900; font-size: 1.15rem; color: var(--text-dark); margin-bottom: 18px; }
    .modal-box .form-group { margin-bottom: 14px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-actions button { flex: 1; border: none; border-radius: 12px; padding: 12px; font-family: 'Nunito', sans-serif; font-weight: 800; cursor: pointer; }
    .btn-cancel { background: #f3f4f6; color: var(--text-dark); }
    .btn-submit { background: var(--green); color: white; }
  </style>
</head>
