  <style>
    .livraison-block { margin-bottom: 24px; border-radius: 18px; overflow: hidden; box-shadow: 0 2px 14px rgba(0,0,0,0.07); }

    /* En-tête sombre */
    .liv-header {
      background: #1e293b; padding: 22px 28px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .liv-id-label { font-size: 0.75rem; color: #64748b; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
    .liv-id       { font-size: 1.6rem; font-weight: 900; color: white; margin-bottom: 8px; }
    .liv-cmd      { font-size: 0.88rem; color: #94a3b8; font-weight: 600; margin-bottom: 6px; }
    .liv-meta     { display: flex; gap: 20px; }
    .liv-meta-item { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #94a3b8; font-weight: 600; }
    .liv-meta-item svg { width: 15px; height: 15px; stroke: #64748b; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* Corps blanc */
    .liv-body { background: white; padding: 24px 28px; }

    /* Grille 3 colonnes */
    .liv-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    @media (max-width: 900px) {
      .liv-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 560px) {
      .liv-grid { grid-template-columns: 1fr; }
    }

    .liv-col { border-radius: 14px; padding: 18px 20px; }
    .liv-col-blue   { background: #eff6ff; }
    .liv-col-green  { background: #f0fdf4; }
    .liv-col-purple { background: #faf5ff; }

    .liv-col-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.82rem; font-weight: 700; color: var(--text-gray);
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px;
    }
    .liv-col-title svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .col-blue   .liv-col-title { color: #3b82f6; }
    .col-green  .liv-col-title { color: var(--green); }
    .col-purple .liv-col-title { color: #7c3aed; }

    .liv-name  { font-size: 1rem; font-weight: 800; color: var(--text-dark); margin-bottom: 8px; }
    .liv-info  { display: flex; align-items: center; gap: 7px; font-size: 0.85rem; color: var(--text-gray); font-weight: 600; margin-bottom: 5px; }
    .liv-info svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .articles-list { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .articles-list li { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; font-weight: 600; color: var(--text-dark); }
    .articles-list li::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #7c3aed; flex-shrink: 0; }
    .liv-total { font-size: 1rem; font-weight: 900; color: #7c3aed; margin-top: 4px; }

    /* Aucun livreur */
    .no-livreur { font-size: 0.88rem; color: #9ca3af; font-weight: 500; text-align: center; padding: 10px 0; margin-bottom: 10px; }

    /* Actions bas */
    .liv-actions { display: flex; gap: 12px; }
    .btn-action-green { flex: 1; background: var(--green); color: white; border: none; border-radius: 12px; padding: 14px; font-family: 'Nunito', sans-serif; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: background 0.2s; }
    .btn-action-green:hover { background: var(--green-dark); }
    .btn-action-blue  { flex: 1; background: #3b82f6; color: white; border: none; border-radius: 12px; padding: 14px; font-family: 'Nunito', sans-serif; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: background 0.2s; }
    .btn-action-blue:hover { background: #2563eb; }
    .btn-action-outline { background: white; color: var(--text-dark); border: 1.5px solid #e5e7eb; border-radius: 12px; padding: 14px 24px; font-family: 'Nunito', sans-serif; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: border-color 0.2s; }
    .btn-action-outline:hover { border-color: var(--green); color: var(--green); }
  </style>
</head>
