<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#22c55e"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Clo-Clo"/>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Historique – Clo-Clo Livreur</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="livreur.css"/>
  <script src="config.js"></script>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-logo">🍹</div>
      <div><div class="sidebar-brand-name">Clo-Clo Livreur</div><div class="sidebar-brand-sub">Espace Livraison</div></div>
    </div>
    <div class="sidebar-profile">
      <div class="profile-avatar" id="profile-avatar" style="cursor:pointer;position:relative;overflow:hidden;" title="Changer ma photo">
        <svg viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
        <input id="photo-input" type="file" accept="image/*" style="display:none;"/>
      </div>
      <div>
        <div class="profile-name">Jean Mukendi</div>
        <div class="profile-id">ID: DRV-001</div>
        <div class="profile-statut">
          <div class="statut-label">Statut :</div>
          <div class="statut-badge"><span class="dot-green"></span> Disponible</div>
        </div>
        <div class="statut-label" style="margin-top:8px;">Ma paie :</div>
        <div class="profile-paie" style="font-weight:800;color:#1a1a2e;">—</div>
        <div class="statut-label" style="margin-top:8px;">Actif aujourd'hui :</div>
        <button id="btn-toggle-actif" style="margin-top:4px;width:100%;background:#dcfce7;color:#16a34a;border:1.5px solid #16a34a;border-radius:8px;padding:7px;font-family:'Nunito',sans-serif;font-weight:800;font-size:0.78rem;cursor:pointer;">✅ Actif</button>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="livreur-dashboard.html" class="nav-item"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Tableau de Bord</a>
      <a href="livreur-livraison.html" class="nav-item"><svg viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>Livraison Active</a>
      <a href="livreur-historique.html" class="nav-item active"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Historique</a>
    </nav>
    <div class="sidebar-bottom">
      <a href="#" class="nav-item nav-item-notifs" id="nav-notifs-link"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>Notifications<span class="notif-badge" style="display:none;">0</span></a>
      <button class="btn-logout js-livreur-logout"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Déconnexion</button>
    </div>
  </aside>

  <main class="main-content">

    <div class="page-header">
      <h1 class="page-title">Historique des Livraisons</h1>
      <p class="page-sub">Toutes vos livraisons passées</p>
    </div>

    <!-- Stats -->
    <div class="stats-grid stats-grid-5">
      <div class="stat-card" style="flex-direction:column;align-items:flex-start;gap:4px;">
        <div class="stat-label">Total</div><div class="stat-value" id="stat-h-total">—</div>
      </div>
      <div class="stat-card" style="flex-direction:column;align-items:flex-start;gap:4px;">
        <div class="stat-label">Complétées</div><div class="stat-value val-green" id="stat-h-completees">—</div>
      </div>
      <div class="stat-card" style="flex-direction:column;align-items:flex-start;gap:4px;">
        <div class="stat-label">Annulées</div><div class="stat-value val-red" id="stat-h-annulees">—</div>
      </div>
      <div class="stat-card" style="flex-direction:column;align-items:flex-start;gap:4px;">
        <div class="stat-label">Pourboires Gagnés</div><div class="stat-value val-blue" id="stat-h-gagne">—</div>
      </div>
      <div class="stat-card" style="flex-direction:column;align-items:flex-start;gap:4px;">
        <div class="stat-label">Note Moyenne</div><div class="stat-value val-yellow" id="stat-h-note">—</div>
      </div>
    </div>

    <!-- Filtres -->
    <div class="filter-row" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="filter-chip active" data-filter="toutes">Toutes (8)</button>
        <button class="filter-chip" data-filter="complete">Complétées (7)</button>
        <button class="filter-chip" data-filter="annule">Annulées (1)</button>
      </div>
      <button id="btn-export-pdf-livreur" style="background:#22c55e;color:white;border:none;border-radius:10px;padding:9px 16px;font-family:'Nunito',sans-serif;font-weight:800;font-size:0.82rem;cursor:pointer;">📄 Exporter en PDF</button>
    </div>

    <!-- Liste historique -->
    <div id="histo-list">
      <!-- Rendu dynamiquement par livreur.js -->
    
    </div>
  </main>

  <script type="module" src="livreur.js"></script>
</body>
</html>
