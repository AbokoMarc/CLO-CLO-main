<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Livreurs – Clo-Clo Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="admin.css"/>
  <script src="config.js"></script>
  <style>
    .livreurs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
    @media (max-width: 640px) {
      .livreurs-grid { grid-template-columns: 1fr; }
    }

    .livreur-card { border-radius: 18px; overflow: hidden; box-shadow: 0 2px 14px rgba(0,0,0,0.07); }

    .livreur-header {
      background: #1e293b; padding: 22px 24px;
      display: flex; align-items: flex-start; gap: 16px;
    }
    .livreur-avatar {
      width: 56px; height: 56px; background: #334155; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .livreur-avatar svg { width: 26px; height: 26px; stroke: #94a3b8; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .livreur-name { font-size: 1.2rem; font-weight: 900; color: white; margin-bottom: 2px; }
    .livreur-id   { font-size: 0.82rem; color: #64748b; font-weight: 600; margin-bottom: 12px; }
    .livreur-stats { display: flex; gap: 8px; }
    .lstat { background: #334155; border-radius: 8px; padding: 6px 12px; text-align: center; }
    .lstat-label { font-size: 0.68rem; color: #64748b; font-weight: 600; }
    .lstat-val   { font-size: 0.95rem; font-weight: 900; color: white; display: flex; align-items: center; gap: 3px; justify-content: center; }
    .lstat-val svg { width: 12px; height: 12px; fill: var(--yellow); }
    .livreur-status-badge { margin-left: auto; }

    .livreur-body { background: white; padding: 20px 24px; }
    .livreur-info { display: flex; align-items: center; gap: 9px; font-size: 0.88rem; font-weight: 600; color: var(--text-dark); margin-bottom: 8px; }
    .livreur-info svg { width: 16px; height: 16px; stroke: var(--green); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

    .livraison-active {
      background: #eff6ff; border-radius: 12px; padding: 12px 16px; margin: 14px 0;
    }
    .la-label { font-size: 0.78rem; font-weight: 700; color: #3b82f6; text-transform: uppercase; margin-bottom: 4px; }
    .la-id    { font-size: 1rem; font-weight: 800; color: #2563eb; }

    .livreur-meta { display: flex; gap: 30px; padding-top: 14px; border-top: 1px solid #f3f4f6; }
    .lm-label { font-size: 0.75rem; color: var(--text-gray); font-weight: 600; text-transform: uppercase; margin-bottom: 4px; }
    .lm-val   { font-size: 0.92rem; font-weight: 700; color: var(--text-dark); }
    .lm-sub   { font-size: 0.78rem; color: var(--text-gray); font-weight: 500; }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-brand"><div class="sidebar-logo">🍹</div><div><div class="sidebar-brand-name">Clo-Clo Admin</div><div class="sidebar-brand-sub">Espace Directeur</div></div></div>
    <nav class="sidebar-nav">
      <a href="admin-dashboard.html" class="nav-item"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Tableau de Bord</a>
            <a href="admin-produits.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12.41V2h10.41l8.18 8.18a2 2 0 0 1 0 2.83z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>Produits</a>
<a href="admin-livraisons.html" class="nav-item"><svg viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>Livraisons en Cours</a>
      <a href="admin-historique.html" class="nav-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Historique</a>
      <a href="admin-clients.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Clients</a>
      <a href="admin-livreurs.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Livreurs</a>
    </nav>
    <div class="sidebar-logout"><button class="btn-logout js-admin-logout"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Déconnexion</button></div>
  </aside>

  <main class="main-content">
    <div class="page-header anim">
      <h1 class="page-title">Gestion des Livreurs</h1>
      <p class="page-sub">Suivi et gestion de l'équipe de livraison</p>
    </div>

    <!-- Stats -->
    <div class="stats-grid stats-grid-5 anim">
      <div class="stat-card"><div class="stat-label">Total Livreurs</div><div class="stat-value" id="stat-liv-total">—</div></div>
      <div class="stat-card"><div class="stat-label">Disponibles</div><div class="stat-value val-green" id="stat-liv-dispo">—</div></div>
      <div class="stat-card"><div class="stat-label">En Livraison</div><div class="stat-value val-blue" id="stat-liv-encours">—</div></div>
      <div class="stat-card"><div class="stat-label">Hors Service</div><div class="stat-value val-orange" id="stat-liv-horsservice">—</div></div>
      <div class="stat-card"><div class="stat-label">Livraisons Aujourd'hui</div><div class="stat-value val-green" id="stat-liv-aujourdhui">—</div></div>
    </div>

    <!-- Grille livreurs -->
    <div class="livreurs-grid" id="livreurs-grid">
      <!-- Rendu dynamiquement par admin.js depuis /api/admin/livreurs -->

        </div>

    <div style="display:flex;justify-content:center;">
      <button class="btn-green" style="padding:14px 32px;font-size:1rem;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
        Ajouter un Livreur
      </button>
    </div>
  </main>

  <script type="module" src="admin.js"></script>
</body>
</html>
