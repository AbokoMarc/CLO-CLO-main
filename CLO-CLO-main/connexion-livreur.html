<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Espace Livreur – Clo-Clo</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="connexion.css"/>
  <script src="config.js"></script>
</head>
<body>

  <!-- Pas de navbar : plein écran vert -->
  <div class="page-bg bg-livreur" style="min-height:100vh;">
    <div class="form-card">

      <div class="card-header">
        <div class="card-icon card-icon-green">🚚</div>
        <h1 class="card-title">Espace Livreur</h1>
        <p class="card-sub">Connexion pour les livreurs Clo-Clo</p>
      </div>

      <!-- Bannière verte -->
      <div class="info-banner banner-green">
        <svg viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
        <div>
          <div class="info-banner-title">Bienvenue !</div>
          <div class="info-banner-sub">Connectez-vous pour gérer vos livraisons</div>
        </div>
      </div>

      <!-- Identifiant -->
      <div class="form-group">
        <label class="form-label">Identifiant Livreur</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" id="input-id" placeholder="DRV-001"/>
        </div>
        <span class="error-msg" id="err-id"></span>
      </div>

      <!-- Mot de passe -->
      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="input-mdp" placeholder="••••••••"/>
          <button type="button" class="toggle-pwd" data-target="input-mdp">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <span class="error-msg" id="err-mdp"></span>
      </div>

      <button class="btn-main" id="btn-login">Se Connecter</button>

      <div class="demo-hint">Demo : driver / driver123</div>

      <div class="bottom-links">
        <a href="index.html">← Site client</a>
        <span class="sep">|</span>
        <a href="connexion-directeur.html">Espace directeur</a>
      </div>

    </div>
  </div>

  <script type="module" src="connexion.js"></script>
</body>
</html>
